# Configuration for SORT Tracker (Simple Online and Realtime Tracking)
# Reference: Bewley et al., ICIP 2016 (GPL-3.0 License)

tracker:
  name: "sort"
  max_age: 1           # Maximum frames to keep a dead track alive before deletion
  min_hits: 3          # Minimum associated detections before track is confirmed
  iou_threshold: 0.3   # Minimum IoU overlap for bipartite association

